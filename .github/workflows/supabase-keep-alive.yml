name: Keep Supabase Awake

on:
  schedule:
    # Runs at 04:00 UTC every 3 days
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          echo "Sending keep-alive ping to Supabase..."
          curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://uxammubevejojnfvjpwe.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4YW1tdWJldmVqb2puZnZqcHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MDczNjksImV4cCI6MjEwMDI4MzM2OX0.YW8oWdv_SA57GaDqtqaIzm77Xppko_fIKJ4zm2cOVWk' }}" || true

      - name: Ping Live Website Cron Endpoint
        run: |
          echo "Pinging website cron endpoint..."
          curl -s -f "https://samstack-tech.vercel.app/api/cron/supabase-ping" || true
